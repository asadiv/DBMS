name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  # ─── JOB 1: Backend Tests ───────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./backend
        run: npm install
      - name: Run tests
        working-directory: ./backend
        run: npm test

  # ─── JOB 2: Frontend Tests ──────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false

  # ─── JOB 3: Build & Push Backend Image ──────────────────
  deploy-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push backend image
        run: |
          docker build -t 399827113344.dkr.ecr.ap-south-1.amazonaws.com/minijira-backend:latest ./backend
          docker push 399827113344.dkr.ecr.ap-south-1.amazonaws.com/minijira-backend:latest

  # ─── JOB 4: Build & Push Frontend Image ─────────────────
  deploy-frontend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push frontend image
        run: |
          docker build -t 399827113344.dkr.ecr.ap-south-1.amazonaws.com/minijira-frontend:latest ./frontend
          docker push 399827113344.dkr.ecr.ap-south-1.amazonaws.com/minijira-frontend:latest

  # ─── JOB 5: Deploy Both on EC2 ───────────────────────────
  deploy-ec2:
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 399827113344.dkr.ecr.ap-south-1.amazonaws.com
            cd ~/DBMS
            docker pull 399827113344.dkr.ecr.ap-south-1.amazonaws.com/minijira-backend:latest
            docker pull 399827113344.dkr.ecr.ap-south-1.amazonaws.com/minijira-frontend:latest
            docker stop minijira-backend || true
            docker rm minijira-backend || true
            docker-compose down
            docker-compose up -d
